name: Pika H3 tests

# Runs the MiniMax-H3 unit tests (the patch's and the existing ones) on pika-build. `zig build test` cannot be used
# while upstream's plugin-kit check does not compile: every test shard depends on it. A filtered test binary built by
# `test-build` has no such dependency. Fork-only.
#
#   gh workflow run pika-h3-tests.yml -R lucheng1/mlx-serve

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Test-name filter"
        default: "minimax"
      ref:
        description: "Branch to test"
        default: "pika-build"
      stage_mlx:
        description: "Upload the built lib/mlx (headers + libs) as an artifact for local type checks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Metal toolchain
        run: |
          xcrun -sdk macosx metal --version >/dev/null 2>&1 \
            || sudo xcodebuild -downloadComponent MetalToolchain

      - name: Cache Zig toolchain
        uses: actions/cache@v4
        with:
          path: .zig-toolchain
          key: zig-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-zig.sh') }}

      - name: Install Zig and dependencies
        run: |
          bash scripts/fetch-zig.sh
          echo "$GITHUB_WORKSPACE/.zig-toolchain" >> "$GITHUB_PATH"
          brew bundle install --file=Brewfile

      - name: Compute cache keys
        id: keys
        run: |
          echo "mlx=$(git -C lib/mlx-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "mlxc=$(git -C lib/mlxc-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | tr ' \n' '--')" >> "$GITHUB_OUTPUT"

      - name: Cache self-built mlx + mlx-c
        uses: actions/cache@v4
        with:
          path: lib/mlx
          key: mlx-stage-${{ steps.keys.outputs.mlx }}-${{ steps.keys.outputs.mlxc }}-${{ hashFiles('patches/mlxc-gather-qmm-global-scale.patch') }}-${{ steps.keys.outputs.xcode }}

      - name: Build mlx + mlx-c
        run: bash scripts/build-mlx.sh

      - name: Upload the mlx stage
        if: inputs.stage_mlx
        run: tar -czf mlx-stage.tgz lib/mlx

      - if: inputs.stage_mlx
        uses: actions/upload-artifact@v4
        with:
          name: mlx-stage
          path: mlx-stage.tgz
          retention-days: 7

      - name: Fetch libllama
        run: bash scripts/fetch-llama.sh

      - name: Build the filtered test binary
        run: zig build test-build -Dtest-filter="${{ inputs.filter }}"

      - name: Run it
        run: ./zig-out/tests/test
